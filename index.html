function getPromptForDay(dn){
  for(var i=0;i<LETTER_PROMPTS.length;i++){
    var lp=LETTER_PROMPTS[i];
    if(dn>=lp.days[0]&&dn<=lp.days[1]){
      return lp.prompts[(dn-lp.days[0])%lp.prompts.length];
    }
  }
  return 'What is this day asking of me?';
}

function gd(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function sd(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getPromptData(){return gd('ual_prompts',{});}
function setPromptData(v){sd('ual_prompts',v);}
function getEntries(){return gd('ual_entries',{});}
function getDayNum(){
  var now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.max(1,Math.min(Math.floor((today-START)/86400000)+1,TOTAL));
}
function getPartForDay(d){for(var i=0;i<PARTS.length;i++){if(d>=PARTS[i].days[0]&&d<=PARTS[i].days[1])return i;}return 0;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function isoForDay(d){
  var dt=new Date(START.getFullYear(),START.getMonth(),START.getDate()+d-1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

function getResponseForDay(d){
  var pd=getPromptData()[d]||{};
  if(pd.response) return {response:pd.response,source:'prompts'};
  var iso=isoForDay(d);
  var entry=getEntries()[iso]||{};
  if(entry.promptResponse) return {response:entry.promptResponse,source:'today'};
  return {response:'',source:null};
}

function hasResponse(d){return !!getResponseForDay(d).response;}

function togglePart(pi){partOpen[pi]=!partOpen[pi];renderList();}
function setFilter(f,el){
  currentFilter=f;

  el.classList.add('active');
  renderList();
}

function renderStats(){
  var responded=0,favorites=0,pd=getPromptData();
  for(var d=1;d<=291;d++){
    if(hasResponse(d)) responded++;
    if(pd[d]&&pd[d].fav) favorites++;
  }
  document.getElementById('statResponded').textContent=responded;
  document.getElementById('statFavorites').textContent=favorites;
  document.getElementById('statRemaining').textContent=291-responded;
}

function renderList(){
  var pd=getPromptData();
  var now=new Date();
  var todayISO=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  var days=[];
  for(var d=1;d<=291;d++){
    var iso=isoForDay(d);
    var isPast=iso<todayISO,isToday=iso===todayISO,isFuture=iso>todayISO;
    var responded=hasResponse(d);
    var fav=!!(pd[d]&&pd[d].fav);
    var show=false;
    if(currentFilter==='all') show=true;
    else if(currentFilter==='today') show=isToday;
    else if(currentFilter==='past') show=isPast;
    else if(currentFilter==='future') show=isFuture;
    else if(currentFilter==='responded') show=responded;
    else if(currentFilter==='favorites') show=fav;
    else if(currentFilter==='unanswered') show=!responded&&!isFuture;
    if(show) days.push({d:d,iso:iso,isPast:isPast,isToday:isToday,isFuture:isFuture,responded:responded,fav:fav});
  }

  if(!days.length){
    document.getElementById('promptList').innerHTML='<div style="text-align:center;color:#5a5070;font-size:13px;padding:30px 0;font-style:italic;">No prompts in this view.</div>';
    return;
  }

  var grouped={};
  days.forEach(function(item){
    var pi=getPartForDay(item.d);
    if(!grouped[pi]) grouped[pi]=[];
    grouped[pi].push(item);
  });

  var html='';
  Object.keys(grouped).sort(function(a,b){return a-b;}).forEach(function(pi){
    var part=PARTS[pi],items=grouped[pi];
    var respondedCount=items.filter(function(x){return x.responded;}).length;
    var isOpen=!!partOpen[pi];

    html+='<div style="margin-bottom:8px;">'
      +'<button onclick="togglePart('+pi+')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:'+part.bg+';border:1px solid rgba(255,255,255,.08);border-left:4px solid '+part.accent+';border-radius:'+(isOpen?'12px 12px 0 0':'12px')+';cursor:pointer;text-align:left;">'
        +'<div>'
          +'<div style="font-size:13px;font-weight:800;color:'+part.accent+';">'+part.name+'</div>'
          +'<div style="font-size:11px;color:#5a5070;margin-top:2px;">'+part.sub+' · '+respondedCount+'/'+items.length+' responded</div>'
        +'</div>'
        +'<div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);border-radius:20px;padding:4px 10px;white-space:nowrap;">'+(isOpen?'▲ Hide':'▼ Show')+'</div>'
      +'</button>'
      +(isOpen
        ?'<div style="background:#0a0018;border:1px solid rgba(255,255,255,.06);border-top:none;border-radius:0 0 12px 12px;padding:8px 10px;">'
          +items.map(function(item){
            var borderClass=item.responded&&item.fav?'responded favorited':item.responded?'responded':item.fav?'favorited':'';
            var dayLabel=item.isToday?'Day '+item.d+' · TODAY':item.isFuture?'Day '+item.d+' · Upcoming':'Day '+item.d;
            var dayColor=item.isToday?part.accent:item.isFuture?'#3a3050':'#5a5070';
            return '<div class="prompt-card '+borderClass+'" onclick="openModal('+item.d+')">'
              +'<div class="prompt-day" style="color:'+dayColor+';">'+dayLabel+'</div>'
              +'<div class="prompt-text">'+getPromptForDay(item.d)+'</div>'
              +'<div class="prompt-meta">'
                +(item.responded?'<span class="badge" style="background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.3);">✅ Responded</span>':'')
                +(item.fav?'<span class="badge" style="background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.3);">★ Favorite</span>':'')
                +(item.responded?'<span style="font-size:11px;color:#5a5070;font-style:italic;">Tap to read or edit →</span>':'<span style="font-size:11px;color:#5a5070;">Tap to respond →</span>')
              +'</div>'
              +'</div>';
          }).join('')
          +'</div>'
        :'')
      +'</div>';
  });

  document.getElementById('promptList').innerHTML=html;
}

var modalDay=0;
function openModal(d){
  modalDay=d;
  var pd=getPromptData(),entry=pd[d]||{};
  var pi=getPartForDay(d);
  var part=PARTS[pi];
  var now=new Date();
  var todayISO=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var iso=isoForDay(d);
  var isToday=iso===todayISO;

  document.getElementById('modalDay').style.color=part.accent;
  document.getElementById('modalDay').textContent=(isToday?'Day '+d+' · TODAY · ':('Day '+d+' · '))+part.name;
  document.getElementById('modalPrompt').textContent='"'+getPromptForDay(d)+'"';

  var resp=getResponseForDay(d);
  document.getElementById('modalTextarea').value=resp.response||'';
  document.getElementById('todaySourceNote').style.display=resp.source==='today'?'block':'none';

  var favBtn=document.getElementById('favBtn');
  favBtn.textContent=entry.fav?'★ Favorited':'☆ Favorite';
  favBtn.classList.toggle('active',!!entry.fav);
  document.getElementById('modalResponsedBadge').style.display=resp.response?'block':'none';
  document.getElementById('promptModal').classList.add('open');
}

function toggleFav(){
  var pd=getPromptData();
  if(!pd[modalDay]) pd[modalDay]={};
  pd[modalDay].fav=!pd[modalDay].fav;
  setPromptData(pd);
  var fav=pd[modalDay].fav;
  var favBtn=document.getElementById('favBtn');
  favBtn.textContent=fav?'★ Favorited':'☆ Favorite';
  favBtn.classList.toggle('active',fav);
  toast(fav?'Added to favorites ★':'Removed from favorites');
}

function saveResponse(){
  var text=document.getElementById('modalTextarea').value.trim();
  var date=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  var pd=getPromptData();
  if(!pd[modalDay]) pd[modalDay]={};
  pd[modalDay].response=text;
  pd[modalDay].updatedAt=date;
  setPromptData(pd);

  var iso=isoForDay(modalDay);
  var entries=getEntries();
  if(!entries[iso]) entries[iso]={};
  entries[iso].promptResponse=text;
  entries[iso].prompt=getPromptForDay(modalDay);
  entries[iso].dayNum=modalDay;
  if(!entries[iso].date) entries[iso].date=iso;
  if(!entries[iso].savedAt) entries[iso].savedAt=new Date().toISOString();
  sd('ual_entries',entries);

  var logs=gd('ual_logs',{});
  var acts=logs[iso]||[];
  if(acts.indexOf('journal')===-1){acts.push('journal');logs[iso]=acts;sd('ual_logs',logs);}

  closeModal();
  renderStats();
  renderList();
  toast('Response saved ✦');
}

function closeModal(){document.getElementById('promptModal').classList.remove('open');}
document.getElementById('promptModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

renderStats();
renderList();
</script>
</body>
</html>
